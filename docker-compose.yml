# docker compose up -d --build      (first: copy .env.example to .env and edit it)
services:
  inera:
    build: .
    container_name: inera
    restart: unless-stopped
    env_file: .env
    environment:
      INERA_DATA_DIR: /data
      # Uncomment to use the bundled Ollama service below:
      # OLLAMA_URL: http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - inera_data:/data

  # Free, fully self-hosted AI engine. Uncomment, then run:
  #   docker compose exec ollama ollama pull llama3.1
  # ollama:
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   volumes:
  #     - ollama_models:/root/.ollama

volumes:
  inera_data:
  # ollama_models:
