<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>InEra All-in-One Plugins</title>
  <meta name="description" content="Describe a problem in plain words. InEra picks the right built-in plugins and does the work: documents, PDFs, study notebooks, quizzes, videos, social posts and scheduled automations.">
  <meta name="theme-color" content="#0F1626">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preload" href="/marcellus.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/jost.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div id="app" aria-live="polite">
    <div class="boot">
      <img src="/logo.svg" alt="InEra" width="120" height="126">
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">InEra needs JavaScript enabled to run.</p></noscript>
</body>
</html>
